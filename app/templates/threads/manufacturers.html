{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 bg-white">
                {% for manufacturer in manufacturers %}
                    {% if source == 'index' %}
                        <form action="{% url 'threads:manufacturer_detail' manufacturer.slug %}" method="get">
                            <button type="submit"
                                    class="btn btn-outline-secondary btn-lg d-grid col-8 mx-auto my-2">
                                {{ manufacturer.name }}
                            </button>
                        </form>
                    {% elif source == 'stock' %}
                        <form action="{% url 'threads:add_thread_stock' manufacturer.slug %}" method="get">
                            <button type="submit"
                                    class="btn btn-outline-secondary btn-lg d-grid col-8 mx-auto my-2">
                                {{ manufacturer.name }}
                            </button>
                        </form>
                    {% elif source == 'basket' %}
                        <form action="{% url 'threads:add_thread_basket' manufacturer.slug %}" method="get">
                            <button type="submit"
                                    class="btn btn-outline-secondary btn-lg d-grid col-8 mx-auto my-2">
                                {{ manufacturer.name }}
                            </button>
                        </form>
                    {% elif source == 'project' %}
                        <form action="{% url 'threads:add_thread_project' manufacturer.slug %}" method="get">
                            <input type="hidden" name="project_id" value="{{ project }}">
                            <button type="submit"
                                    class="btn btn-outline-secondary btn-lg d-grid col-8 mx-auto my-2">
                                {{ manufacturer.name }}
                            </button>
                        </form>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
